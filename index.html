<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GameBox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg2:#1b2838;--panel:#22384f;--panel2:#2a475e;--ink:#e8f1f8;--dim:#8fa9bf;--acc:#66c0f4}
html,body{height:100%}
body{background:linear-gradient(180deg,#0d141c,#16222f 60%,#0f1720);color:var(--ink);
 font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:40;background:#10161d;border-bottom:1px solid #000;box-shadow:0 2px 14px rgba(0,0,0,.6)}
.hrow{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:1px;font-size:20px}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#1a5c8a);
 display:grid;place-items:center;font-size:17px;box-shadow:0 0 16px rgba(102,192,244,.5)}
.logo span{color:var(--acc)}
nav{display:flex;gap:4px}
nav button{padding:8px 14px;border-radius:8px;color:var(--dim);font-weight:700;font-size:14px}
nav button.on{background:var(--panel2);color:#fff}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#0a1016;border:1px solid #2a3b4d;
 border-radius:20px;padding:7px 14px;min-width:190px}
.search input{background:none;border:0;outline:0;color:var(--ink);width:100%;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.hero{border-radius:16px;overflow:hidden;margin-bottom:22px;background:#0b1219;border:1px solid #2a3b4d;
 display:flex;min-height:220px;cursor:pointer}
.hero .art{flex:1.3;display:grid;place-items:center;font-size:92px;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.hero .info{flex:1;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:9px;background:rgba(6,12,18,.5)}
.hero h2{font-size:27px}
.hero p{color:var(--dim);font-size:14px;line-height:1.5}
.tagline{font-size:11px;letter-spacing:2px;color:var(--acc);font-weight:800}
h3.sec{font-size:14px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:22px 0 12px;
 border-bottom:1px solid #2a3b4d;padding-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:14px;background:var(--panel);color:var(--dim);font-size:13px;font-weight:600}
.chip.on{background:var(--acc);color:#06121c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid #2a3b4d;border-radius:12px;overflow:hidden;
 transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.55);border-color:var(--acc)}
.cart{height:110px;display:grid;place-items:center;font-size:52px;position:relative}
.cart:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.22),transparent 60%)}
.cbody{padding:10px 12px 13px}
.cbody b{display:block;font-size:15px;margin-bottom:4px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim)}
.gen{background:#0d1a26;border:1px solid #2a3b4d;border-radius:8px;padding:2px 7px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(4,9,14,.86);display:none;place-items:center;padding:18px}
.sheet.on{display:grid}
.sbox{width:min(560px,100%);background:var(--bg2);border:1px solid var(--panel2);border-radius:16px;overflow:hidden}
.sart{height:150px;display:grid;place-items:center;font-size:74px}
.sbody{padding:18px}
.sbody p{color:var(--dim);font-size:14px;line-height:1.55;margin:9px 0 14px}
.stats{display:flex;gap:20px;font-size:12px;color:var(--dim);margin-bottom:16px;flex-wrap:wrap}
.stats b{display:block;color:#fff;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:9px;font-weight:800;font-size:15px;
 background:linear-gradient(180deg,#63b33f,#3d7d26);color:#fff;box-shadow:0 4px 0 #22521a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #22521a}
.btn.alt{background:var(--panel2);box-shadow:0 4px 0 #16303f}
.btn.alt:active{box-shadow:0 2px 0 #16303f}
#player{position:fixed;inset:0;z-index:80;background:#05090d;display:none;flex-direction:column}
#player.on{display:flex}
.pbar{display:flex;align-items:center;gap:14px;padding:9px 14px;background:#10161d;border-bottom:1px solid #000}
.hud{margin-left:auto;display:flex;gap:16px;font-size:12px;color:var(--dim);text-align:center}
.hud b{display:block;color:var(--acc);font-size:15px}
.xbtn{background:#3d1f22;border:1px solid #6b2e33;border-radius:8px;padding:6px 13px;font-weight:700;font-size:13px}
#stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:10px;padding:10px;overflow:hidden}
canvas.gcv{max-width:100%;max-height:calc(100vh - 190px);border-radius:10px;background:#000;
 box-shadow:0 10px 44px rgba(0,0,0,.7);touch-action:none}
.hint{color:var(--dim);font-size:12.5px;text-align:center}
.pad{display:flex;gap:24px;align-items:center;justify-content:center;touch-action:none}
.dz{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px}
.dz button{background:var(--panel2);border-radius:10px;font-size:19px;font-weight:800}
.dz button:active{background:var(--acc);color:#06121c}
.abtn{width:80px;height:80px;border-radius:50%;background:linear-gradient(180deg,#63b33f,#3d7d26);
 font-weight:800;font-size:15px;box-shadow:0 5px 0 #22521a}
.abtn:active{transform:translateY(3px);box-shadow:0 2px 0 #22521a}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,9,14,.82);z-index:5}
.obox{background:var(--bg2);border:1px solid var(--panel2);border-radius:16px;padding:26px 32px;text-align:center}
.obox .big{font-size:46px;font-weight:800;color:var(--acc);margin:6px 0}
.obox .nb{color:#ffd66b;font-weight:700;margin-bottom:12px}
.obox .row{justify-content:center;margin-top:8px}
.dg{display:flex;flex-direction:column;align-items:center;gap:12px}
.b2048{display:grid;grid-template-columns:repeat(4,76px);gap:8px;background:#16222f;padding:8px;border-radius:12px;touch-action:none}
.tile{width:76px;height:76px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:25px;background:#22384f}
.mgrid{display:grid;grid-template-columns:repeat(4,72px);gap:9px}
.mcard{width:72px;height:72px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:34px;cursor:pointer}
.mcard.hid{color:transparent;background:linear-gradient(135deg,#2a475e,#16222f)}
.mcard.done{background:#2c5f39}
.ttt{display:grid;grid-template-columns:repeat(3,86px);gap:8px}
.ttt button{width:86px;height:86px;background:var(--panel2);border-radius:12px;font-size:44px;font-weight:800}
.holes{display:grid;grid-template-columns:repeat(3,94px);gap:12px}
.hole{width:94px;height:94px;border-radius:50%;background:#12202c;border:3px solid #2a475e;display:grid;
 place-items:center;font-size:42px;cursor:pointer;overflow:hidden}
.hole .m{transform:translateY(95px);transition:.12s}
.hole.up .m{transform:translateY(0)}
@media(max-width:640px){.hero{flex-direction:column}.hero .art{padding:24px 0;font-size:70px}
 .search{order:3;width:100%;margin-left:0}.b2048,.mgrid,.holes{transform:scale(.9)}}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="logo"><div class="dot">🎮</div>GAME<span>BOX</span></div>
  <nav><button class="on" data-tab="store">Store</button><button data-tab="lib">My Library</button></nav>
  <div class="search">🔍<input id="q" placeholder="search games..."></div>
</div></header>
<main><div id="view"></div></main>
<div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>
<div id="player">
  <div class="pbar"><b id="pTitle">Game</b><div class="hud" id="hud"></div>
  <button class="xbtn" id="quit">✕ Quit</button></div>
  <div id="stage"></div>
</div>
<script>
/* ============ save data ============ */
var store={};
try{store=JSON.parse(localStorage.getItem('gamebox')||'{}')}catch(e){store={}}
function S(id){if(!store[id])store[id]={t:0,p:0,best:0,fav:false,last:0};return store[id]}
function save(){try{localStorage.setItem('gamebox',JSON.stringify(store))}catch(e){}}
function fmt(s){if(!s)return'0m';if(s<60)return s+'s';var m=Math.round(s/60);return m<60?m+'m':(m/60|0)+'h '+(m%60)+'m'}

/* ============ player framework ============ */
var cur=null,keys={},keyCbs=[],raf=0,running=false,startT=0,stopFns=[],bestAtStart=0;
function kd(e){var k=e.key;
  if(k===' '||k.indexOf('Arrow')===0)e.preventDefault();
  if(!keys[k])keyCbs.slice().forEach(function(c){c(k)});
  keys[k]=true}
function ku(e){keys[e.key]=false}

function hud(o){var h=document.getElementById('hud'),s='';
  for(var k in o)s+='<span>'+k+'<b>'+o[k]+'</b></span>';h.innerHTML=s}

function launch(g){
  document.getElementById('sheet').classList.remove('on');
  cur=g;keys={};keyCbs=[];stopFns=[];running=true;startT=Date.now();
  document.getElementById('pTitle').textContent=g.icon+'  '+g.title;
  document.getElementById('player').classList.add('on');
  var stage=document.getElementById('stage');stage.innerHTML='';
  hud({Score:0,Best:S(g.id).best});
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
  var s=S(g.id);s.p++;s.last=Date.now();bestAtStart=s.best;save();
  g.play(makeApi(stage));
}
function quit(){
  running=false;cancelAnimationFrame(raf);
  window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);
  stopFns.forEach(function(f){f()});stopFns=[];
  if(cur){var s=S(cur.id);s.t+=Math.round((Date.now()-startT)/1000);save()}
  document.getElementById('player').classList.remove('on');
  document.getElementById('stage').innerHTML='';cur=null;render();
}
document.getElementById('quit').onclick=quit;

function gameOver(sc,msg){
  running=false;cancelAnimationFrame(raf);
  var s=S(cur.id),nb=sc>bestAtStart&&sc>0;if(sc>s.best)s.best=sc;save();
  var o=document.createElement('div');o.className='over';
  o.innerHTML='<div class="obox"><h2>'+(msg||'Game Over')+'</h2><div class="big">'+sc+'</div>'+
   '<div class="nb">'+(nb?'⭐ NEW HIGH SCORE!':'Best: '+s.best)+'</div>'+
   '<div class="row"><button class="btn" id="again">Play Again</button>'+
   '<button class="btn alt" id="exit">Exit</button></div></div>';
  document.getElementById('stage').appendChild(o);
  o.querySelector('#again').onclick=function(){var g=cur;quit();launch(g)};
  o.querySelector('#exit').onclick=quit;
}

function makeApi(stage){
  var api={
    stage:stage,
    canvas:function(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;c.className='gcv';
      stage.appendChild(c);return c},
    div:function(cls){var d=document.createElement('div');d.className=cls||'dg';stage.appendChild(d);return d},
    hint:function(t){var d=document.createElement('div');d.className='hint';d.innerHTML=t;stage.appendChild(d);return d},
    key:function(k){return !!keys[k]},
    onKey:function(cb){keyCbs.push(cb)},
    score:function(n,extra){var s=S(cur.id);
      if(n>s.best){s.best=n;save()}
      var o={Score:n,Best:s.best};
      if(extra)for(var k in extra)o[k]=extra[k];hud(o)},
    hud:hud,
    loop:function(fn){var last=performance.now();
      (function step(t){if(!running)return;var dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);
        raf=requestAnimationFrame(step)})(last)},
    onQuit:function(fn){stopFns.push(fn)},
    btn:function(txt,fn){var b=document.createElement('button');b.className='btn alt';
      b.style.fontSize='13px';b.style.padding='8px 16px';b.textContent=txt;b.onclick=fn;
      stage.appendChild(b);return b},
    every:function(ms,fn){var i=setInterval(function(){if(running)fn()},ms);stopFns.push(function(){clearInterval(i)});return i},
    tap:function(cb){var f=function(e){e.preventDefault();cb()};
      stage.addEventListener('pointerdown',f);stopFns.push(function(){stage.removeEventListener('pointerdown',f)})},
    over:gameOver,
    dpad:function(kind,label){
      var pad=document.createElement('div');pad.className='pad';
      function mk(txt,key,cls){
        var b=document.createElement('button');b.textContent=txt;if(cls)b.className=cls;
        function dn(e){e.preventDefault();if(!keys[key])keyCbs.slice().forEach(function(c){c(key)});keys[key]=true}
        function up(e){e.preventDefault();keys[key]=false}
        b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
        b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);return b}
      if(kind&&kind!=='tap'){
        var z=document.createElement('div');z.className='dz';
        var map={1:['▲','ArrowUp'],3:['◀','ArrowLeft'],5:['▶','ArrowRight'],7:['▼','ArrowDown']};
        for(var i=0;i<9;i++){
          var use=map[i]&&(kind==='full'||(kind==='lr'&&(i===3||i===5))||(kind==='lrd'&&i!==1));
          z.appendChild(use?mk(map[i][0],map[i][1]):document.createElement('div'));
        }
        pad.appendChild(z);
      }
      if(label)pad.appendChild(mk(label,' ','abtn'));
      stage.appendChild(pad);return pad}
  };
  return api;
}

/* ============ ONLINE PLAY (WebRTC peer-to-peer + room codes) ============ */
function loadPeer(cb){
  if(window.Peer)return cb(true);
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=function(){cb(!!window.Peer)};
  s.onerror=function(){cb(false)};
  document.head.appendChild(s);
}
function makeNet(){
  var peer=null,conn=null,onMsg=null;
  function wire(c,st){
    conn=c;
    c.on('data',function(d){if(onMsg)onMsg(d)});
    c.on('open',function(){st('ready')});
    c.on('close',function(){st('lost')});
    c.on('error',function(e){st('error',(e&&e.type)||'error')})}
  return {
    host:function(code,st){
      peer=new window.Peer('gbx-'+code,{debug:0});
      peer.on('open',function(){st('waiting')});
      peer.on('connection',function(c){wire(c,st)});
      peer.on('error',function(e){st('error',(e&&e.type)||'error')})},
    join:function(code,st){
      peer=new window.Peer(null,{debug:0});
      peer.on('open',function(){wire(peer.connect('gbx-'+code,{serialization:'json'}),st)});
      peer.on('error',function(e){st('error',(e&&e.type)||'error')})},
    onData:function(fn){onMsg=fn},
    send:function(o){try{if(conn&&conn.open)conn.send(o)}catch(e){}},
    close:function(){try{if(conn)conn.close()}catch(e){}
      try{if(peer)peer.destroy()}catch(e){}}
  };
}
/* opts: {blurb, local:fn, lan:fn|null, online:fn(role,net)} */
function netUI(a,opts){
  var box=a.div('dg');box.style.maxWidth='560px';
  var info=document.createElement('div');
  info.style.cssText='text-align:center;color:#8fa9bf;line-height:1.65;font-size:14px';
  info.innerHTML=opts.blurb;box.appendChild(info);
  var row=document.createElement('div');
  row.className='row';row.style.justifyContent='center';row.style.flexWrap='wrap';
  box.appendChild(row);
  var status=document.createElement('div');
  status.style.cssText='text-align:center;color:#66c0f4;font-size:15px;min-height:28px;line-height:1.5';
  box.appendChild(status);
  function btn(txt,cls,fn){
    var b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');
    b.textContent=txt;b.onclick=fn;row.appendChild(b);return b}
  function menu(){
    row.innerHTML='';status.innerHTML='';
    btn('🎮 Same Screen','',function(){box.remove();opts.local()});
    btn('🌐 Online vs a Friend','alt',function(){online()});
    if(opts.lan)btn('🪟 Two Windows','alt',function(){box.remove();opts.lan()})}
  function online(){
    row.innerHTML='';status.textContent='Getting the online bit ready…';
    loadPeer(function(ok){
      if(!ok){status.innerHTML='Could not load online play.<br>Check your internet, then try again.';
        return menu()}
      status.innerHTML='One of you makes a room, the other joins with the code.';
      btn('➕ Make a Room','',makeRoom);
      btn('🔑 Join a Room','alt',joinRoom);
      btn('← Back','alt',menu)})}
  function code4(){
    var C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';
    for(var i=0;i<4;i++)s+=C[Math.random()*C.length|0];
    return s}
  function go(role,net){box.remove();opts.online(role,net)}
  function makeRoom(){
    row.innerHTML='';
    var code=code4(),net=makeNet();a.onQuit(net.close);
    status.innerHTML='<div style="font-size:13px;color:#8fa9bf">Tell your friend this code:</div>'+
      '<div style="font-size:46px;font-weight:800;letter-spacing:10px;color:#ffd43b">'+code+'</div>'+
      '<div style="font-size:13px;color:#8fa9bf">Waiting for them to join…</div>';
    net.host(code,function(st,why){
      if(st==='ready')go('host',net);
      if(st==='error'){net.close();
        status.innerHTML='That room would not open ('+why+').<br>Try making another one.';
        row.innerHTML='';btn('➕ Try again','',makeRoom);btn('← Back','alt',menu)}})}
  function joinRoom(){
    row.innerHTML='';status.innerHTML='Type your friend\'s 4-letter code:';
    var line=document.createElement('div');
    line.className='row';line.style.justifyContent='center';box.appendChild(line);
    var inp=document.createElement('input');
    inp.placeholder='CODE';inp.maxLength=4;inp.autocapitalize='characters';
    inp.style.cssText='width:160px;text-align:center;font-size:30px;letter-spacing:8px;'+
      'text-transform:uppercase;background:#0a1016;border:1px solid #2a3b4d;color:#e8f1f8;'+
      'border-radius:10px;padding:8px 6px;outline:none';
    line.appendChild(inp);
    var go2=document.createElement('button');go2.className='btn';go2.textContent='Join';
    line.appendChild(go2);
    go2.onclick=function(){
      var code=(inp.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(code.length<4){status.textContent='Type all 4 letters of the code.';return}
      var net=makeNet();a.onQuit(net.close);
      status.textContent='Knocking on room '+code+'…';
      net.join(code,function(st,why){
        if(st==='ready'){line.remove();go('guest',net)}
        if(st==='error'||st==='lost'){net.close();
          status.innerHTML='Could not join room '+code+'.<br>Check the code and that your friend made the room.'}})};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')go2.onclick()});
    setTimeout(function(){inp.focus()},50)}
  menu();
}

/* ============ GAMES ============ */
var GAMES=[
/* --- 1. SNAKE --- */
{id:'snake',title:'Snake Dash',genre:'Arcade',icon:'🐍',c1:'#12b45c',c2:'#06351f',
 desc:'Munch apples, grow huge, and never bite your own tail. Gets faster every bite!',
 play:function(a){
  var cfg=this.cfg||{};
  var N=cfg.n||20,U=Math.round(400/(cfg.n||20)),c=a.canvas(N*U,N*U),x=c.getContext('2d');
  var BG=cfg.bg||'#0a1a12',GC=cfg.grid||'#102a1e',SK=cfg.ink||'#1bd473',FD=cfg.food||'🍎';
  var sn=[{x:10,y:10}],d={x:1,y:0},nd={x:1,y:0},f={x:15,y:10},sc=0,acc=0,sp=cfg.sp||.14;
  function free(){var p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}
    while(sn.some(function(s){return s.x===p.x&&s.y===p.y}));return p}
  a.onKey(function(k){
    var m={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]}[k];
    if(m&&!(m[0]===-d.x&&m[1]===-d.y)&&!(m[0]===d.x&&m[1]===d.y))nd={x:m[0],y:m[1]}});
  a.hint('Arrow keys / WASD or the buttons');a.dpad('full');
  function draw(){
    x.fillStyle=BG;x.fillRect(0,0,N*U,N*U);
    x.strokeStyle=GC;for(var i=0;i<N;i++){x.beginPath();x.moveTo(i*U,0);x.lineTo(i*U,N*U);
      x.moveTo(0,i*U);x.lineTo(N*U,i*U);x.stroke()}
    x.font=Math.round(U*.9)+'px serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText(FD,f.x*U+U/2,f.y*U+U/2);
    sn.forEach(function(s,i){x.fillStyle=i?SK:'#ffffff';
      x.fillRect(s.x*U+1,s.y*U+1,U-2,U-2)});
  }
  a.loop(function(dt){acc+=dt;if(acc<sp){draw();return}acc=0;d=nd;
    var h={x:sn[0].x+d.x,y:sn[0].y+d.y};
    if(cfg.wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}

    var i0=Math.floor((nx-13)/TS),i1=Math.floor((nx+13)/TS),
        j0=Math.floor((ny-13)/TS),j1=Math.floor((ny+13)/TS);
    for(var i=i0;i<=i1;i++)for(var j=j0;j<=j1;j++){
      if(i<0||j<0||i>=TW||j>=TH)return true;if(map[j][i])return true}
    return false}
  build();a.score(0,{HP:'❤'.repeat(hp),Room:(room+1)+'/'+ROOMS});
  function ui(){a.score(sc,{HP:hp>0?'❤'.repeat(hp):'💀',Room:(room+1)+'/'+ROOMS})}
  a.onKey(function(k){if((k===' '||k==='f')&&atk<=0)atk=.26});
  a.hint('Arrows / WASD to walk · Space to swing your sword');
  a.dpad('full','SWING');
  a.loop(function(dt){
    atk-=dt;inv-=dt;
    var mx=(a.key('ArrowLeft')||a.key('a')?-1:0)+(a.key('ArrowRight')||a.key('d')?1:0);
    var my=(a.key('ArrowUp')||a.key('w')?-1:0)+(a.key('ArrowDown')||a.key('s')?1:0);
    if(mx||my){dx=mx;dy=my}

      if(d<m.r+14&&inv<=0){hp--;inv=1.1;ui();if(hp<=0)a.over(sc,'You fell in the dungeon...')}
      if(atk>.13){
        var sx=px+dx*30,sy=py+dy*30;
        if(Math.hypot(m.x-sx,m.y-sy)<m.r+22&&!m.hurt){m.hp--;m.hurt=.3;
          if(m.hp<=0){sc+=m.boss?500:40;ui()}}}
      if(m.hurt>0)m.hurt-=dt});
    if(!mobs.some(function(m){return m.hp>0})&&px>(TW-2)*TS){
      room++;sc+=100;
      if(room>=ROOMS)return a.over(sc,'🏆 DUNGEON CLEARED!');
      build();ui()}
    x.fillStyle='#1d1430';x.fillRect(0,0,TW*TS,TH*TS);
    for(var j=0;j<TH;j++)for(var i=0;i<TW;i++){
      if(map[j][i]){x.fillStyle='#4a3b6b';x.fillRect(i*TS,j*TS,TS,TS);
        x.fillStyle='#5f4d86';x.fillRect(i*TS,j*TS,TS,5)}
      else{x.fillStyle=(i+j)%2?'#2a2044':'#2f2450';x.fillRect(i*TS,j*TS,TS,TS)}}
    var clear=!mobs.some(function(m){return m.hp>0});
    x.fillStyle=clear?'#ffd66b':'#3a2f55';x.fillRect((TW-1)*TS,5*TS,TS,TS);
    x.font='26px serif';x.textAlign='center';x.textBaseline='middle';
    mobs.forEach(function(m){if(m.hp<=0)return;
      x.font=(m.boss?'44px':'26px')+' serif';
      x.globalAlpha=m.hurt>0?.5:1;x.fillText(m.boss?BOSS:FOE,m.x,m.y);x.globalAlpha=1});
    x.font='26px serif';
    x.globalAlpha=inv>0?.55:1;x.fillText(HERO,px,py);x.globalAlpha=1;
    if(atk>0){x.strokeStyle='#ffe066';x.lineWidth=5;x.beginPath();
      x.moveTo(px,py);x.lineTo(px+dx*34,py+dy*34);x.stroke()}
    if(clear){x.fillStyle='#ffd66b';x.font='15px sans-serif';
      x.fillText('Room clear! Exit is on the right →',TW*TS/2,22)}
    if(msg){x.fillStyle='#fff';x.font='bold 26px sans-serif';x.fillText(msg,TW*TS/2,TH*TS/2)}
  });
 }},

{id:'race',title:'Turbo Racer',genre:'Racing',icon:'🏎️',c1:'#ff5c7a',c2:'#3d0616',
 desc:'Three laps around the speedway against a rival racer. Stay on the tarmac or you will bog down in the grass.',
 play:function(a){
  var cfg=this.cfg||{},LAPS=cfg.laps||3,GRASS=cfg.bg||'#2f6b33',TAR=cfg.ink||'#3b4148',CAR=cfg.car||'🏎️';
  var W=680,H=440,c=a.canvas(W,H),x=c.getContext('2d');
  var CX=W/2,CY=H/2,RX=250,RY=155,RW=cfg.rw||.23;
  function road(px,py){return Math.abs(Math.hypot((px-CX)/RX,(py-CY)/RY)-1)<RW}
  var car={x:CX,y:CY+RY,a:0,s:0},ai={t:Math.PI/2,s:1},lap=0,cp=0,time=0,done=false;
  a.hint('▲ gas · ▼ brake · ◀ ▶ steer');a.dpad('full');
  a.score(0,{Lap:'1/'+LAPS,Time:'0.0'});
  a.loop(function(dt){
    if(done)return;
    time+=dt;
    if(a.key('ArrowUp')||a.key('w'))car.s+=190*dt;
    if(a.key('ArrowDown')||a.key('s'))car.s-=230*dt;
    var on=road(car.x,car.y);
    car.s*=on?(1-.55*dt):(1-2.7*dt);
    car.s=Math.max(-70,Math.min(on?265:120,car.s));
    var turn=(a.key('ArrowLeft')||a.key('a')?-1:0)+(a.key('ArrowRight')||a.key('d')?1:0);
    car.a+=turn*2.5*dt*Math.min(1,Math.abs(car.s)/70);
    car.x+=Math.cos(car.a)*car.s*dt;car.y+=Math.sin(car.a)*car.s*dt;
    car.x=Math.max(8,Math.min(W-8,car.x));car.y=Math.max(8,Math.min(H-8,car.y));
    ai.t+=(.52+Math.sin(time*.7)*.05)*dt;
    var ax=CX+Math.cos(ai.t)*RX,ay=CY+Math.sin(ai.t)*RY;
    var th=Math.atan2(car.y-CY,car.x-CX);
    var q=th>0&&car.x>CX?0:(th>0?1:(car.x<CX?2:3));
    if(q===(cp+1)%4){cp=q;if(cp===0){lap++;
      if(lap>=LAPS){done=true;
        var pts=Math.max(100,Math.round(4000-time*28));
        var won=ai.t<Math.PI/2+Math.PI*6;
        return a.over(pts,'🏁 '+time.toFixed(1)+'s — '+(won?'YOU BEAT THE RIVAL!':'Rival got there first'))}}}
    a.score(Math.max(0,Math.round(3000-time*20)),{Lap:Math.min(LAPS,lap+1)+'/'+LAPS,Time:time.toFixed(1)});
    x.fillStyle=GRASS;x.fillRect(0,0,W,H);
    x.strokeStyle=TAR;x.lineWidth=RX*RW*2;
    x.beginPath();x.ellipse(CX,CY,RX,RY,0,0,7);x.stroke();
    x.strokeStyle='#e8eef5';x.lineWidth=3;x.setLineDash([16,20]);
    x.beginPath();x.ellipse(CX,CY,RX,RY,0,0,7);x.stroke();x.setLineDash([]);
    x.fillStyle='#fff';x.fillRect(CX-3,CY+RY-RX*RW,6,RX*RW*2);
    x.font='26px serif';x.textAlign='center';x.textBaseline='middle';
    x.save();x.translate(ax,ay);x.rotate(ai.t+Math.PI/2);x.fillText('🚙',0,0);x.restore();
    x.save();x.translate(car.x,car.y);x.rotate(car.a+Math.PI/2);x.fillText(CAR,0,0);x.restore();
    if(!on){x.fillStyle='#ffd66b';x.font='bold 16px sans-serif';x.fillText('OFF TRACK!',CX,30)}
  });
 }},

/* --- 16. TANK DUEL (2 players / two windows) --- */
{id:'tank',title:'Tank Duel',genre:'2 Player',icon:'💥',online:true,c1:'#ffb84d',c2:'#3d2606',
 desc:'Two players! Share one keyboard, or play a friend anywhere in the world with a room code. First to 5 hits wins.',
 play:function(a){
  var cfg=this.cfg||{},NWALL=cfg.walls||9,WIN=cfg.win||5;
  var W=660,H=430,c=a.canvas(W,H),x=c.getContext('2d');
  var walls=[],t1,t2,shots=[],s1=0,s2=0,net=null,role='local',myId=Math.random().toString(36).slice(2),peer=null,last={};
  for(var i=0;i<NWALL;i++)walls.push({x:60+Math.random()*(W-200),y:50+Math.random()*(H-150),
    w:30+Math.random()*90,h:26});
  function mkTank(px,py,ang,col){return{x:px,y:py,a:ang,c:col,cool:0,hit:0}}
  function reset(){t1=mkTank(70,H/2,0,'#66c0f4');t2=mkTank(W-70,H/2,Math.PI,'#ff8fa3');shots=[]}
  reset();
  function blocked(px,py){
    if(px<14||py<14||px>W-14||py>H-14)return true;
    return walls.some(function(w){return px>w.x-12&&px<w.x+w.w+12&&py>w.y-12&&py<w.y+w.h+12})}
  function drive(t,f,turn,fire,dt){
    t.a+=turn*2.3*dt;
    var nx=t.x+Math.cos(t.a)*f*128*dt,ny=t.y+Math.sin(t.a)*f*128*dt;
    if(!blocked(nx,t.y))t.x=nx; if(!blocked(t.x,ny))t.y=ny;
    t.cool-=dt;t.hit-=dt;
    if(fire&&t.cool<=0){t.cool=.75;
      shots.push({x:t.x+Math.cos(t.a)*20,y:t.y+Math.sin(t.a)*20,
        vx:Math.cos(t.a)*290,vy:Math.sin(t.a)*290,b:2,own:t})}}
  function physics(dt,i1,i2){
    drive(t1,i1.f,i1.t,i1.fire,dt);
    drive(t2,i2.f,i2.t,i2.fire,dt);
    shots.forEach(function(s){
      var nx=s.x+s.vx*dt,ny=s.y+s.vy*dt;
      if(blocked(nx,s.y)){s.vx=-s.vx;s.b--}else s.x=nx;
      if(blocked(s.x,ny)){s.vy=-s.vy;s.b--}else s.y=ny;
      [t1,t2].forEach(function(t){
        if(t!==s.own&&Math.hypot(t.x-s.x,t.y-s.y)<16&&s.b>=0){
          s.b=-9;t.hit=.7;
          if(t===t1)s2++;else s1++;
          a.score(Math.max(s1,s2)*100,{P1:s1,P2:s2});
          if(s1>=WIN||s2>=WIN)return a.over(Math.max(s1,s2)*100,(s1>=WIN?'🔵 PLAYER 1 WINS!':'🔴 PLAYER 2 WINS!'));
          reset()}})});
    shots=shots.filter(function(s){return s.b>=0})}
  function keysFor(set){return{
    f:(a.key(set[0])?1:0)-(a.key(set[1])?1:0),
    t:(a.key(set[3])?1:0)-(a.key(set[2])?1:0),
    fire:a.key(set[4])}}
  function draw(){
    x.fillStyle='#16222f';x.fillRect(0,0,W,H);
    x.fillStyle='#2a475e';walls.forEach(function(w){x.fillRect(w.x,w.y,w.w,w.h)});
    x.fillStyle='#ffe066';shots.forEach(function(s){x.beginPath();x.arc(s.x,s.y,4,0,7);x.fill()});
    [t1,t2].forEach(function(t){
      x.save();x.translate(t.x,t.y);x.rotate(t.a);
      x.fillStyle=t.hit>0?'#fff':t.c;x.fillRect(-14,-11,28,22);
      x.fillStyle='#16222f';x.fillRect(0,-3,24,6);x.restore()});
    x.fillStyle='#66c0f4';x.font='bold 22px sans-serif';x.textAlign='left';x.fillText(s1,16,30);
    x.fillStyle='#ff8fa3';x.textAlign='right';x.fillText(s2,W-16,30);
    if(role==='guest'||role==='host'){x.fillStyle='#8fa9bf';x.font='12px sans-serif';
      x.textAlign='center';x.fillText(peer?('Connected — you are '+(role==='host'?'BLUE':'RED')):'Waiting for the other window...',W/2,22)}}
  netUI(a,{
    blurb:'<b style="color:#e8f1f8;font-size:17px">How do you want to duel?</b><br>'+
      '<b>Same Screen</b> — two of you on one keyboard: WASD + F vs Arrows + Enter.<br>'+
      '<b>Online vs a Friend</b> — one of you makes a room code, the other types it in. '+
      'Works anywhere in the world.<br>'+
      '<b>Two Windows</b> — two windows on this same computer.',
    local:startLocal,lan:startLan,online:startOnline});
  function startOnline(role,net){
    var over=false;
    net.onData(function(m){
      if(role==='host'){if(m.k)last=m.k}
      else{
        if(m.w)walls=m.w;
        if(m.a){t1.x=m.a[0];t1.y=m.a[1];t1.a=m.a[2];t2.x=m.b[0];t2.y=m.b[1];t2.a=m.b[2];
          shots=m.s.map(function(q){return{x:q[0],y:q[1],b:0}});
          s1=m.p[0];s2=m.p[1];a.score(Math.max(s1,s2)*100,{P1:s1,P2:s2})}
        if(m.over&&!over){over=true;
          a.over(Math.max(s1,s2)*100,m.over)}}});
    if(role==='host')net.send({w:walls});
    a.hint('You are the <b>'+(role==='host'?'BLUE':'RED')+'</b> tank. '+
      'Arrows / buttons to drive, Space to fire.');
    a.dpad('full','FIRE');a.score(0,{P1:0,P2:0});
    var acc=0,wasRunning=true;
    a.loop(function(dt){
      var me=keysFor(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ']);
      if(role==='host'){
        physics(dt,me,{f:last.f||0,t:last.t||0,fire:!!last.fire});
        if(wasRunning&&!running){wasRunning=false;
          net.send({over:(s1>=WIN?'🔵 BLUE WINS!':'🔴 RED WINS!'),p:[s1,s2]});return}
        acc+=dt;
        if(acc>.045){acc=0;
          net.send({a:[t1.x,t1.y,t1.a],b:[t2.x,t2.y,t2.a],
            s:shots.map(function(q){return[q.x,q.y]}),p:[s1,s2]})}
      }else{acc+=dt;if(acc>.045){acc=0;net.send({k:me})}}
      draw()})}
  function startLocal(){
    role='local';
    a.hint('P1 (blue): W A S D + F to fire &nbsp;·&nbsp; P2 (red): Arrow keys + Enter to fire');
    a.score(0,{P1:0,P2:0});
    a.loop(function(dt){
      physics(dt,keysFor(['w','s','a','d','f']),
                 keysFor(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter']));
      draw()})}
  function startLan(){
    if(!window.BroadcastChannel){a.hint('This browser cannot do two-window play. Use Same Screen.');return startLocal()}
    net=new BroadcastChannel('gamebox-tank');
    a.onQuit(function(){try{net.postMessage({t:'bye',id:myId});net.close()}catch(e){}});
    role='host';
    net.onmessage=function(e){var m=e.data;if(m.id===myId)return;
      if(m.t==='hello'){peer=m.id;if(role==='host')net.postMessage({t:'welcome',id:myId})}
      if(m.t==='welcome'){peer=m.id;role='guest'}
      if(m.t==='in'&&role==='host')last=m.k;
      if(m.t==='state'&&role==='guest'){
        t1.x=m.a[0];t1.y=m.a[1];t1.a=m.a[2];t2.x=m.b[0];t2.y=m.b[1];t2.a=m.b[2];
        shots=m.s.map(function(q){return{x:q[0],y:q[1],b:0}});
        s1=m.p[0];s2=m.p[1];a.score(Math.max(s1,s2)*100,{P1:s1,P2:s2});
        walls=m.w||walls}
      if(m.t==='bye'){peer=null}};
    net.postMessage({t:'hello',id:myId});
    a.hint('Two-window mode: <b>Arrow keys</b> to drive, <b>Space</b> to fire. Blue tank = the window that opened first.');
    a.dpad('full','FIRE');
    a.score(0,{P1:0,P2:0});
    var acc=0;
    a.loop(function(dt){
      var me=keysFor(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ']);
      if(role==='host'){
        physics(dt,me,{f:last.f||0,t:last.t||0,fire:!!last.fire});
        acc+=dt;
        if(acc>.05){acc=0;
          net.postMessage({t:'state',id:myId,a:[t1.x,t1.y,t1.a],b:[t2.x,t2.y,t2.a],
            s:shots.map(function(q){return [q.x,q.y]}),p:[s1,s2],w:walls})}
      }else{
        acc+=dt;if(acc>.05){acc=0;net.postMessage({t:'in',id:myId,k:me})}}
      draw()})}
 }},

{id:'maze',title:'Maze Runner',genre:'Puzzle',icon:'🌀',c1:'#4dd2ff',c2:'#06283d',
 desc:'A brand-new twisty maze every single time. Find the golden star before the clock runs out.',
 play:function(a){
  var cfg=this.cfg||{},N=cfg.n||15,TS=Math.max(16,Math.round(460/N));
  var c=a.canvas(N*TS,N*TS),x=c.getContext('2d');
  var WALL=cfg.ink||'#4dd2ff',BG=cfg.bg||'#06283d',HERO=cfg.hero||'🐭';
  var cells=[],i,j;
  for(j=0;j<N;j++){cells.push([]);for(i=0;i<N;i++)cells[j].push({u:1,d:1,l:1,r:1,v:0})}
  var st=[[0,0]];cells[0][0].v=1;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],ns=[];
    if(cy>0&&!cells[cy-1][cx].v)ns.push('u');
    if(cy<N-1&&!cells[cy+1][cx].v)ns.push('d');
    if(cx>0&&!cells[cy][cx-1].v)ns.push('l');
    if(cx<N-1&&!cells[cy][cx+1].v)ns.push('r');
    if(!ns.length){st.pop();continue}
    var dd=ns[Math.random()*ns.length|0];
    if(dd==='u'){cells[cy][cx].u=0;cells[cy-1][cx].d=0;cells[cy-1][cx].v=1;st.push([cx,cy-1])}
    else if(dd==='d'){cells[cy][cx].d=0;cells[cy+1][cx].u=0;cells[cy+1][cx].v=1;st.push([cx,cy+1])}
    else if(dd==='l'){cells[cy][cx].l=0;cells[cy][cx-1].r=0;cells[cy][cx-1].v=1;st.push([cx-1,cy])}
    else{cells[cy][cx].r=0;cells[cy][cx+1].l=0;cells[cy][cx+1].v=1;st.push([cx+1,cy])}}
  var px=0,py=0,steps=0,t=cfg.time||90;
  a.onKey(function(k){
    var m={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'}[k];
    if(!m)return;var cc=cells[py][px];
    if(m==='u'&&!cc.u)py--;else if(m==='d'&&!cc.d)py++;
    else if(m==='l'&&!cc.l)px--;else if(m==='r'&&!cc.r)px++;else return;
    steps++;a.score(Math.max(0,t*10),{Time:t,Steps:steps});
    if(px===N-1&&py===N-1)a.over(Math.max(100,t*20+500-steps*2),'🏁 ESCAPED!')});
  a.dpad('full');a.hint('Get to the ⭐ in the bottom-right corner!');
  a.every(1000,function(){t--;a.score(Math.max(0,t*10),{Time:t,Steps:steps});
    if(t<=0)a.over(0,'Out of time!')});
  a.score(0,{Time:t,Steps:0});
  a.loop(function(){
    x.fillStyle=BG;x.fillRect(0,0,N*TS,N*TS);
    x.strokeStyle=WALL;x.lineWidth=2;x.beginPath();
    for(var j=0;j<N;j++)for(var i=0;i<N;i++){var cc=cells[j][i];
      if(cc.u){x.moveTo(i*TS,j*TS);x.lineTo(i*TS+TS,j*TS)}
      if(cc.l){x.moveTo(i*TS,j*TS);x.lineTo(i*TS,j*TS+TS)}
      if(j===N-1&&cc.d){x.moveTo(i*TS,j*TS+TS);x.lineTo(i*TS+TS,j*TS+TS)}
      if(i===N-1&&cc.r){x.moveTo(i*TS+TS,j*TS);x.lineTo(i*TS+TS,j*TS+TS)}}
    x.stroke();
    x.font=Math.round(TS*.8)+'px serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText('⭐',(N-.5)*TS,(N-.5)*TS);
    x.fillText(HERO,(px+.5)*TS,(py+.5)*TS)});
 }},

{id:'simon',title:'Copy Cat',genre:'Brain',icon:'🎵',c1:'#69db7c',c2:'#08301a',
 desc:'Watch the pattern light up, then tap it back. One more step every round. How long is your memory?',
 play:function(a){

    b.onclick=function(){

 }},

/* --- 20. SLIDE PUZZLE --- */
{id:'slide',title:'Slide Puzzle',genre:'Puzzle',icon:'🧩',c1:'#8fa9bf',c2:'#1b2a38',
 desc:'The classic sliding number puzzle. Shuffle it back into order in as few moves as you can.',
 play:function(a){
  var cfg=this.cfg||{},N=cfg.n||4,PX=Math.round(300/N);
  var wrap=a.div('dg'),g=document.createElement('div');
  g.style.cssText='display:grid;gap:6px;grid-template-columns:repeat('+N+','+PX+'px)';
  wrap.appendChild(g);
  var arr=[],i;for(i=0;i<N*N;i++)arr.push(i);
  var blank=N*N-1,moves=0;
  function nbrs(k){var r=k/N|0,c2=k%N,o=[];
    if(r>0)o.push(k-N);if(r<N-1)o.push(k+N);if(c2>0)o.push(k-1);if(c2<N-1)o.push(k+1);return o}
  for(i=0;i<N*N*30;i++){var nb=nbrs(blank),tt=nb[Math.random()*nb.length|0];
    arr[blank]=arr[tt];arr[tt]=N*N-1;blank=tt}
  var tiles=[];
  for(i=0;i<N*N;i++)(function(i){
    var b=document.createElement('button');
    b.style.cssText='width:'+PX+'px;height:'+PX+'px;border-radius:10px;background:#2a475e;'+
      'font-weight:800;font-size:'+Math.round(PX*.38)+'px';
    b.onclick=function(){
      if(nbrs(blank).indexOf(i)<0)return;
      arr[blank]=arr[i];arr[i]=N*N-1;blank=i;moves++;paint();
      if(solved())a.over(Math.max(100,3000-moves*10),'🏆 SOLVED in '+moves+' moves!')};
    g.appendChild(b);tiles.push(b)})(i);
  function solved(){for(var k=0;k<N*N;k++)if(arr[k]!==k)return false;return true}
  function paint(){
    for(var k=0;k<N*N;k++){var v=arr[k];
      tiles[k].textContent=v===N*N-1?'':(v+1);
      tiles[k].style.background=v===N*N-1?'#16222f':'#2a475e'}
    a.score(Math.max(0,3000-moves*10),{Moves:moves})}
  paint();a.hint('Tap a tile next to the empty hole. Get 1 … '+(N*N-1)+' in order!');
 }},

{id:'stack',title:'Tower Stacker',genre:'Arcade',icon:'🏗️',c1:'#4dabf7',c2:'#062138',

/* --- 24. ASTEROIDS --- */
{id:'rocks',title:'Asteroid Field',genre:'Shooter',icon:'🪨',c1:'#8fa9bf',c2:'#0b1119',
 desc:'Turn, thrust and blast. Big rocks split into smaller ones and the field never really ends.',
 play:function(a){
  var cfg=this.cfg||{},W=560,H=440,c=a.canvas(W,H),x=c.getContext('2d');
  var sh={x:W/2,y:H/2,a:0,vx:0,vy:0},bs=[],rk=[],sc=0,lives=cfg.lives||3,cd=0,inv=2;
  function spawn(n,sz,ax,ay){for(var i=0;i<n;i++)rk.push({

    bs=bs.filter(function(b){return b.t>0});
    rk.forEach(function(r){r.x=(r.x+r.vx*dt+W)%W;r.y=(r.y+r.vy*dt+H)%H});
    for(var i=rk.length-1;i>=0;i--){
      var rr=rk[i].s*9+7,killed=false;

/* --- 26. MATCH 3 --- */
{id:'gem',title:'Gem Crush',genre:'Puzzle',icon:'💎',c1:'#4dd2ff',c2:'#0a2538',
 desc:'Swap two gems to line up three or more. Chains keep falling — score as much as you can before time runs out.',
 play:function(a){
  var cfg=this.cfg||{},N=cfg.n||8,TS=Math.round(368/N),c=a.canvas(N*TS,N*TS),x=c.getContext('2d');
  var GEMS=cfg.set||['💎','🍎','🍋','🫐','🍇','⭐'];
  var g=[],sel=null,sc=0,t=cfg.time||60,i,j;
  for(i=0;i<N;i++){g.push([]);for(j=0;j<N;j++)g[i].push(Math.random()*GEMS.length|0)}
  function matches(){
    var m=[],r,cc;
    for(r=0;r<N;r++)for(cc=0;cc<N-2;cc++)
      if(g[r][cc]===g[r][cc+1]&&g[r][cc]===g[r][cc+2])m.push([r,cc],[r,cc+1],[r,cc+2]);
    for(cc=0;cc<N;cc++)for(r=0;r<N-2;r++)
      if(g[r][cc]===g[r+1][cc]&&g[r][cc]===g[r+2][cc])m.push([r,cc],[r+1,cc],[r+2,cc]);
    return m}
  function resolve(){
    var m=matches();if(!m.length)return false;
    m.forEach(function(p){g[p[0]][p[1]]=-1});
    sc+=m.length*10;
    for(var cc=0;cc<N;cc++){var col=[];
      for(var r=N-1;r>=0;r--)if(g[r][cc]>=0)col.push(g[r][cc]);
      for(var r2=N-1;r2>=0;r2--)g[r2][cc]=col.length?col.shift():(Math.random()*GEMS.length|0)}
    return true}
  var guard=0;while(resolve()&&guard++<200){}
  sc=0;
  c.addEventListener('pointerdown',function(e){
    var rc=c.getBoundingClientRect();
    var cx=Math.floor((e.clientX-rc.left)/rc.width*N),cy=Math.floor((e.clientY-rc.top)/rc.height*N);
    if(cx<0||cy<0||cx>=N||cy>=N)return;
    if(!sel){sel=[cy,cx];return}
    if(Math.abs(sel[0]-cy)+Math.abs(sel[1]-cx)===1){
      var tmp=g[sel[0]][sel[1]];g[sel[0]][sel[1]]=g[cy][cx];g[cy][cx]=tmp;
      if(!matches().length){var t2=g[sel[0]][sel[1]];g[sel[0]][sel[1]]=g[cy][cx];g[cy][cx]=t2}
      else{var lp=0;while(resolve()&&lp++<60){}a.score(sc,{Time:t})}}
    sel=null});
  a.every(1000,function(){t--;a.score(sc,{Time:t});if(t<=0)a.over(sc,"Time's up!")});
  a.hint('Tap one gem, then a neighbour, to swap them. Make lines of 3!');
  a.score(0,{Time:t});
  a.loop(function(){
    x.fillStyle=cfg.bg||'#121a26';x.fillRect(0,0,N*TS,N*TS);
    x.font=Math.round(TS*.72)+'px serif';x.textAlign='center';x.textBaseline='middle';
    for(var r=0;r<N;r++)for(var cc=0;cc<N;cc++){
      if(sel&&sel[0]===r&&sel[1]===cc){x.fillStyle='rgba(102,192,244,.4)';
        x.fillRect(cc*TS,r*TS,TS,TS)}
      x.fillStyle='#fff';x.fillText(GEMS[g[r][cc]]||'',cc*TS+TS/2,r*TS+TS/2)}});
 }},

/* --- 27. MINESWEEPER --- */
{id:'mine',title:'Mine Finder',genre:'Brain',icon:'💣',c1:'#ffa94d',c2:'#3d2205',
 desc:'Numbers tell you how many bombs are touching. Open every safe square without going boom.',
 play:function(a){
  var cfg=this.cfg||{},N=cfg.n||9,M=cfg.mines||10,flagMode=false;
  var PX=Math.round(330/N);
  var wrap=a.div('dg'),g=document.createElement('div');
  g.style.cssText='display:grid;gap:3px;grid-template-columns:repeat('+N+','+PX+'px)';
  wrap.appendChild(g);
  var mines=[],open=[],flags=[],cells=[],i,left=N*N-M;
  for(i=0;i<N*N;i++){mines.push(0);open.push(0);flags.push(0)}
  var placed=0;while(placed<M){var k=Math.random()*N*N|0;if(!mines[k]){mines[k]=1;placed++}}
  function near(k){var r=k/N|0,c2=k%N,n=0;
    for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
      var rr=r+dr,cc=c2+dc;if(rr<0||cc<0||rr>=N||cc>=N)continue;
      if(mines[rr*N+cc])n++}
    return n}
  function reveal(k){
    if(open[k]||flags[k])return;
    open[k]=1;left--;
    if(mines[k]){paint(true);return a.over(0,'💥 BOOM!')}
    if(near(k)===0){var r=k/N|0,c2=k%N;
      for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
        var rr=r+dr,cc=c2+dc;if(rr<0||cc<0||rr>=N||cc>=N)continue;
        reveal(rr*N+cc)}}
    paint();a.score((N*N-M-left)*10,{Left:left});
    if(left<=0)a.over(1000,'🏆 ALL CLEAR!')}
  for(i=0;i<N*N;i++)(function(i){
    var b=document.createElement('button');
    b.style.cssText='width:'+PX+'px;height:'+PX+'px;border-radius:6px;background:#2a475e;'+
      'font-weight:800;font-size:'+Math.round(PX*.48)+'px';
    b.onclick=function(){if(flagMode){flags[i]=flags[i]?0:1;paint()}else reveal(i)};
    b.oncontextmenu=function(e){e.preventDefault();flags[i]=flags[i]?0:1;paint()};
    g.appendChild(b);cells.push(b)})(i);
  function paint(showAll){
    var COLS=['','#4dabf7','#69db7c','#ff8fa3','#ffd43b','#ffa94d','#b06bf0','#fff','#8fa9bf'];
    for(var k=0;k<N*N;k++){var b=cells[k];
      if(flags[k]&&!open[k]){b.textContent='🚩';b.style.background='#2a475e';continue}
      if(!open[k]&&!showAll){b.textContent='';b.style.background='#2a475e';continue}
      if(mines[k]){b.textContent='💣';b.style.background='#5c2430';continue}
      var n=near(k);b.textContent=n||'';b.style.background='#16222f';b.style.color=COLS[n]}}

{id:'four',title:'Four in a Row',genre:'Board',icon:'🔴',c1:'#ff6b6b','c2':'#3d0d12',
 desc:'Drop your reds, block the robot yellows, and get four in a line any direction.',
 play:function(a){

  for(i=0;i<R*C;i++)b.push(0);

  function drop(col,who){for(var r=R-1;r>=0;r--)if(!b[r*C+col]){b[r*C+col]=who;return r}return -1}
  function win(who){
    for(var r=0;r<R;r++)for(var c2=0;c2<C;c2++){
      if(c2<C-3&&b[r*C+c2]===who&&b[r*C+c2+1]===who&&b[r*C+c2+2]===who&&b[r*C+c2+3]===who)return true;
      if(r<R-3&&b[r*C+c2]===who&&b[(r+1)*C+c2]===who&&b[(r+2)*C+c2]===who&&b[(r+3)*C+c2]===who)return true;
      if(r<R-3&&c2<C-3&&b[r*C+c2]===who&&b[(r+1)*C+c2+1]===who&&b[(r+2)*C+c2+2]===who&&
        b[(r+3)*C+c2+3]===who)return true;
      if(r>2&&c2<C-3&&b[r*C+c2]===who&&b[(r-1)*C+c2+1]===who&&b[(r-2)*C+c2+2]===who&&
        b[(r-3)*C+c2+3]===who)return true}
    return false}
  function full(){for(var c2=0;c2<C;c2++)if(!b[c2])return false;return true}
  function paint(){cells.forEach(function(d,k){
    d.style.background=b[k]===1?'#ff6b6b':(b[k]===2?'#ffd43b':'#0d1a26')})}
  function ai(){
    var c2,r;
    for(c2=0;c2<C;c2++){if(b[c2])continue;r=drop(c2,2);
      if(win(2)){paint();return}b[r*C+c2]=0}
    for(c2=0;c2<C;c2++){if(b[c2])continue;r=drop(c2,1);var w=win(1);b[r*C+c2]=0;

    var opts=[];for(c2=0;c2<C;c2++)if(!b[c2])opts.push(c2);

  function turn(col){

{id:'flood',title:'Flood It',genre:'Puzzle',icon:'🎨',c1:'#b06bf0',c2:'#2a0b45',

 play:function(a){

/* --- 35. AIR HOCKEY (2 player) --- */
{id:'hockey',title:'Air Hockey',genre:'2 Player',icon:'🏒',c1:'#4dd2ff',c2:'#06283d',online:true,
 desc:'Two players: share one screen, or play a friend anywhere in the world with a room code. First to 7 goals wins.',
 play:function(a){
  var W=420,H=620,c=a.canvas(W,H),x=c.getContext('2d');
  var p1={x:W/2,y:H-70},p2={x:W/2,y:70},pk={x:W/2,y:H/2,vx:0,vy:-150},s1=0,s2=0,R=26,PR=32;
  var mode='local',mine=null,over=false;
  function clampP(p,bottom){
    p.x=Math.max(PR,Math.min(W-PR,p.x));
    p.y=bottom?Math.max(H/2+PR,Math.min(H-PR,p.y)):Math.max(PR,Math.min(H/2-PR,p.y))}
  c.addEventListener('pointermove',function(e){
    if(!e.buttons&&e.pointerType==='touch')return;
    var r=c.getBoundingClientRect();
    var mx=(e.clientX-r.left)/r.width*W,my=(e.clientY-r.top)/r.height*H;
    if(mode==='local'){var t=my>H/2?p1:p2;t.x=mx;t.y=my}
    else{var q=mine==='p1'?p1:p2;q.x=mx;q.y=my;clampP(q,mine==='p1')}});
  function keysMove(p,set,dt,bottom){
    var sp=340;
    if(a.key(set[0]))p.x-=sp*dt; if(a.key(set[1]))p.x+=sp*dt;
    if(a.key(set[2]))p.y-=sp*dt; if(a.key(set[3]))p.y+=sp*dt;
    clampP(p,bottom)}
  function simPuck(dt){
    pk.x+=pk.vx*dt;pk.y+=pk.vy*dt;pk.vx*=.999;pk.vy*=.999;
    if(pk.x<R){pk.x=R;pk.vx=-pk.vx} if(pk.x>W-R){pk.x=W-R;pk.vx=-pk.vx}
    [p1,p2].forEach(function(p){
      var d=Math.hypot(pk.x-p.x,pk.y-p.y);
      if(d<R+PR){var ang=Math.atan2(pk.y-p.y,pk.x-p.x);
        pk.x=p.x+Math.cos(ang)*(R+PR);pk.y=p.y+Math.sin(ang)*(R+PR);
        var sp2=Math.max(270,Math.hypot(pk.vx,pk.vy)*1.05);
        pk.vx=Math.cos(ang)*sp2;pk.vy=Math.sin(ang)*sp2}});
    if(pk.y<R||pk.y>H-R){
      if(Math.abs(pk.x-W/2)<80){
        var top=pk.y<R;
        if(top)s1++;else s2++;
        a.score(Math.max(s1,s2)*100,{P1:s1,P2:s2});
        pk={x:W/2,y:H/2,vx:0,vy:top?150:-150};
        if(s1>=7)return '🔵 BLUE WINS!';
        if(s2>=7)return '🩷 PINK WINS!'}

  function draw(label){
    x.fillStyle='#0d2233';x.fillRect(0,0,W,H);

    x.fillStyle='#16303f';x.fillRect(W/2-80,0,160,8);x.fillRect(W/2-80,H-8,160,8);
    x.fillStyle='#66c0f4';x.beginPath();x.arc(p1.x,p1.y,PR,0,7);x.fill();
    x.fillStyle='#ff8fa3';x.beginPath();x.arc(p2.x,p2.y,PR,0,7);x.fill();
    x.fillStyle='#ffe066';x.beginPath();x.arc(pk.x,pk.y,R,0,7);x.fill();
    x.fillStyle='#22384f';x.font='bold 26px monospace';x.textAlign='center';
    x.fillText(s2,30,H/2-16);x.fillText(s1,30,H/2+38);
    if(label){x.fillStyle='#8fa9bf';x.font='12px sans-serif';x.fillText(label,W/2,H/2-14)}}
  netUI(a,{
    blurb:'<b style="color:#e8f1f8;font-size:17px">Air Hockey</b><br>'+
      '<b>Same Screen</b> — blue uses W A S D, pink uses the arrow keys (or a finger each).<br>'+
      '<b>Online vs a Friend</b> — one makes a room code, the other types it in.',
    local:startLocal,online:startOnline});
  function startLocal(){
    mode='local';
    a.hint('Blue (bottom): W A S D &nbsp;·&nbsp; Pink (top): arrow keys &nbsp;·&nbsp; or drag a finger on each half');
    a.score(0,{P1:0,P2:0});
    a.loop(function(dt){
      keysMove(p1,['a','d','w','s'],dt,true);
      keysMove(p2,['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'],dt,false);
      var w=simPuck(dt);

      if(w)a.over(700,w)})}
  function startOnline(role,net){
    mode='net';mine=role==='host'?'p1':'p2';
    net.onData(function(m){
      if(role==='host'){if(m.p)  {p2.x=m.p[0];p2.y=m.p[1];clampP(p2,false)}}
      else{
        if(m.a){p1.x=m.a[0];p1.y=m.a[1];pk.x=m.k[0];pk.y=m.k[1];
          s1=m.s[0];s2=m.s[1];a.score(Math.max(s1,s2)*100,{P1:s1,P2:s2})}
        if(m.over&&!over){over=true;a.over(700,m.over)}}});
    a.hint('You are the <b>'+(role==='host'?'BLUE paddle at the bottom':'PINK paddle at the top')+
      '</b>. Move with the arrow keys or drag with your finger.');
    a.score(0,{P1:0,P2:0});
    var acc=0;
    a.loop(function(dt){
      var me=mine==='p1'?p1:p2;
      keysMove(me,['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'],dt,mine==='p1');
      if(role==='host'){
        var w=simPuck(dt);
        acc+=dt;
        if(acc>.04){acc=0;net.send({a:[p1.x,p1.y],k:[pk.x,pk.y],s:[s1,s2]})}
        draw('online');
        if(w){net.send({over:w,s:[s1,s2]});a.over(700,w)}
      }else{
        acc+=dt;
        if(acc>.04){acc=0;net.send({p:[p2.x,p2.y]})}
        draw('online')}})}
 }}
];

var TIERS=['Chill','Classic','Turbo'];
(function buildPacks(){
  var base={};GAMES.forEach(function(g){base[g.id]=g});
  var made=[];
  VARIANTS.forEach(function(v){
    var b=base[v.b];if(!b)return;
    THEMES.forEach(function(t,ti){
      var e=pack(ti,3);
      for(var d=0;d<3;d++){
        made.push({
          id:v.b+'-'+ti+'-'+d,
          title:t[0]+' '+v.n+' · '+TIERS[d],
          genre:b.genre,icon:b.icon,c1:t[3],c2:t[4],pack:t[0],
          desc:TIERS[d]+' '+v.n.toLowerCase()+' from the '+t[0]+' pack. '+b.desc,
          cfg:v.mk(t,d,e,ti),play:b.play})}})});
  GAMES=GAMES.concat(made);
})();

/* ============ UI ============ */
var tab='store',genre='All',q='',shown=48;
function artStyle(g){return'background:linear-gradient(140deg,'+g.c1+','+g.c2+')'}
function cardHTML(g,extra){var s=S(g.id);
  return'<div class="card" data-id="'+g.id+'"><div class="cart" style="'+artStyle(g)+'">'+g.icon+'</div>'+
   '<div class="cbody"><b>'+g.title+'</b><div class="meta"><span class="gen">'+g.genre+
   (g.online?' 🌐':'')+'</span>'+
   '<span>'+(extra||(s.best?'Best '+s.best:'Not played'))+'</span></div></div></div>'}

function render(){
  var v=document.getElementById('view');
  var list=GAMES.filter(function(g){
    return(genre==='All'||g.genre===genre)&&
      (!q||g.title.toLowerCase().indexOf(q)>=0||g.genre.toLowerCase().indexOf(q)>=0)});
  if(tab==='store'){
    var gens=['All'];GAMES.forEach(function(g){if(gens.indexOf(g.genre)<0)gens.push(g.genre)});
    var f=GAMES[Math.floor(Date.now()/9000)%16];
    var page=list.slice(0,shown);
    v.innerHTML='<div class="hero" data-id="'+f.id+'"><div class="art" style="'+artStyle(f)+'">'+f.icon+'</div>'+
      '<div class="info"><div class="tagline">FEATURED &amp; FREE</div><h2>'+f.title+'</h2><p>'+f.desc+'</p>'+
      '<div class="row"><button class="btn">▶ Play Now</button>'+
      '<button class="btn alt" data-rnd="1">🎲 Surprise Me</button></div></div></div>'+
      '<div class="chips">'+gens.map(function(x){
        return'<button class="chip'+(x===genre?' on':'')+'" data-gen="'+x+'">'+x+'</button>'}).join('')+'</div>'+
      '<h3 class="sec">'+list.length+' games'+(genre==='All'&&!q?' in the store':' found')+
      ' &nbsp;·&nbsp; showing '+page.length+'</h3>'+
      '<div class="grid">'+page.map(function(g){return cardHTML(g)}).join('')+'</div>'+
      (list.length>page.length?'<div class="row" style="justify-content:center;margin-top:20px">'+
        '<button class="btn alt" data-more="1">Load 48 more ▾</button></div>':'');
  }else{
    var played=GAMES.filter(function(g){return S(g.id).p>0})
      .sort(function(a,b){return S(b.id).last-S(a.id).last});
    var tt=0,tp=0;played.forEach(function(g){tt+=S(g.id).t;tp+=S(g.id).p});
    v.innerHTML='<h3 class="sec">My Library</h3>'+
      '<div class="stats" style="font-size:13px"><span>Games played<b>'+played.length+'</b></span>'+
      '<span>Total sessions<b>'+tp+'</b></span><span>Time played<b>'+fmt(tt)+'</b></span></div>'+
      (played.length?'<div class="grid">'+played.map(function(g){
        return cardHTML(g,fmt(S(g.id).t)+' · '+S(g.id).best)}).join('')+'</div>'
        :'<p style="color:#8fa9bf">No games yet. Go to the Store and play one!</p>');
  }
}
document.addEventListener('click',function(e){
  var more=e.target.closest('[data-more]');
  if(more){shown+=48;render();return}
  var rnd=e.target.closest('[data-rnd]');
  if(rnd){launch(GAMES[Math.random()*GAMES.length|0]);return}
  var chip=e.target.closest('.chip');
  if(chip){genre=chip.dataset.gen;shown=48;render();return}
  var nb=e.target.closest('nav button');
  if(nb){tab=nb.dataset.tab;shown=48;
    document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b===nb)});
    render();return}
  var card=e.target.closest('.card,.hero');
  if(card){openSheet(card.dataset.id);return}
});
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.toLowerCase();render()});
document.getElementById('sheet').addEventListener('click',function(e){
  if(e.target.id==='sheet')e.currentTarget.classList.remove('on')});

function openSheet(id){
  var g=GAMES.filter(function(x){return x.id===id})[0];if(!g)return;
  var s=S(id),box=document.getElementById('sbox');
  box.innerHTML='<div class="sart" style="'+artStyle(g)+'">'+g.icon+'</div><div class="sbody">'+
    '<h2>'+g.title+'</h2><span class="gen">'+g.genre+'</span><p>'+g.desc+'</p>'+
    '<div class="stats"><span>High score<b>'+s.best+'</b></span><span>Times played<b>'+s.p+'</b></span>'+
    '<span>Time played<b>'+fmt(s.t)+'</b></span></div>'+
    '<div class="row"><button class="btn" id="go">▶ Play</button>'+
    '<button class="btn alt" id="back">Back</button></div></div>';
  box.querySelector('#go').onclick=function(){launch(g)};
  box.querySelector('#back').onclick=function(){document.getElementById('sheet').classList.remove('on')};
  document.getElementById('sheet').classList.add('on');
}
render();
setInterval(function(){if(tab==='store'&&!cur&&!document.getElementById('sheet').classList.contains('on'))render()},9000);
